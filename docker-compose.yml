services:
  # ============================================================
  # Laravel Application (PHP 8.3 + Apache)
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newspaper-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Newspaper Distribution System"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8000
      APP_TIMEZONE: Asia/Colombo

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-new_papers}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-mysecretpassword}

      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      LOG_CHANNEL: stack
      LOG_LEVEL: debug
    volumes:
      # Persist Laravel storage (logs, file uploads, etc.)
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - newspaper-network

  # ============================================================
  # Vite Dev Server for hot reloading UI changes
  # ============================================================
  vite:
    image: node:22-alpine
    container_name: newspaper-vite
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    environment:
      VITE_APP_NAME: "Newspaper Distribution System"
    networks:
      - newspaper-network

  # ============================================================
  # PostgreSQL 16 Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: newspaper-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-new_papers}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mysecretpassword}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-new_papers}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - newspaper-network

  # ============================================================
  # Redis (Cache / Queue / Session)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: newspaper-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - newspaper-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-storage:
    driver: local
  app-logs:
    driver: local

networks:
  newspaper-network:
    driver: bridge
